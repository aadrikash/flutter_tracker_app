name: tracker_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  # GPS / location
  geolocator: ^13.0.2
  # Reverse geocoding (city name from coordinates)
  geocoding: ^3.0.0
  # AR / 3-D model viewer (uses Google Scene Viewer on Android for true AR)
  model_viewer_plus: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
